name: ${COMPOSE_PROJECT_NAME:-pawline_demo}
x-app: &app
  image: pawline-local:1
  build: .
  env_file: ${PAWLINE_ENV_FILE:-.env}
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    MEDIA_DIR: /media
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    NODE_ENV: production
  volumes:
    - media:/media
  networks: [local]
services:
  db:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [local]
  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_UI_AUTH: operator:${MAIL_PASSWORD}
      MP_DISABLE_VERSION_CHECK: "true"
      MP_MAX_MESSAGES: 10000
    volumes: [mail:/data]
    ports: ["127.0.0.1:${MAIL_PORT:-8025}:8025"]
    networks: [local]
  init:
    <<: *app
    command: sh -c 'npx prisma migrate deploy && npx tsx scripts/seed.ts'
    depends_on:
      db: { condition: service_healthy }
  web:
    <<: *app
    restart: unless-stopped
    command: npm start
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3000/api/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    <<: *app
    restart: unless-stopped
    command: npm run worker
    depends_on:
      init: { condition: service_completed_successfully }
  db-ui:
    profiles: [database-tools]
    image: ${PAWLINE_DATABASE_UI_IMAGE:-pawline-local:1}
    restart: unless-stopped
    init: true
    command: node /opt/pawline/database-ui.mjs
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CHECKPOINT_DISABLE: "1"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    volumes:
      - ./scripts/database-ui.mjs:/opt/pawline/database-ui.mjs:ro
    ports: ["127.0.0.1:${DATABASE_UI_PORT:-5555}:5555"]
    networks: [local]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:5555",{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  database:
    labels: { com.pawline.project: "${COMPOSE_PROJECT_NAME:-pawline_demo}" }
  media:
    labels: { com.pawline.project: "${COMPOSE_PROJECT_NAME:-pawline_demo}" }
  mail:
    labels: { com.pawline.project: "${COMPOSE_PROJECT_NAME:-pawline_demo}" }
networks:
  local:
    internal: false
